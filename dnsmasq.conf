# Отключить DNS: контейнер работает только как DHCP-сервер.
port=0

# Слушать только TAP-интерфейс, подключённый к GNS3 Cloud.
interface=tap-dhcp
bind-interfaces

# Писать DHCP-обмен и отладочные сообщения в docker logs.
log-dhcp
log-debug
log-facility=-

# Считать этот сервер основным DHCP-сервером лабораторной сети.
dhcp-authoritative

# Пул адресов, маска и срок аренды.
dhcp-range=10.10.10.100,10.10.10.200,255.255.255.0,1h

# Не выдавать клиенту шлюз и DNS.
dhcp-option=3
dhcp-option=6

# Активные аренды хранятся внутри контейнера и удаляются вместе с ним.
dhcp-leasefile=/tmp/dnsmasq.leases
